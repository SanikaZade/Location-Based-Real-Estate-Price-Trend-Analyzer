<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Simple Google Map</title>
    <style>
      /* Make the map fill the whole page */
      html, body { height: 100%; margin: 0; padding: 0; }
      #map { height: 100%; width: 100%; }
      /* Optional: a tiny floating UI for instructions */
      .badge {
        position: absolute; z-index: 1; top: 12px; left: 12px;
        background: rgba(255,255,255,0.9); padding: 8px 12px; border-radius: 12px;
        font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; font-size: 14px;
        box-shadow: 0 6px 24px rgba(0,0,0,0.08);
      }
      .badge code { background: #f4f4f5; padding: 2px 6px; border-radius: 6px; }
    </style>
  </head>
  <body>
    <div class="badge">Center: <strong>Nagpur</strong> • Zoom: <code>12</code></div>
    <div id="map"></div>

    <script>
      // Initialize and add the map
      function initMap() {
        // Center map (Nagpur, India). Change to your preferred location.
        const center = { lat: 21.1458, lng: 79.0882 };

        const map = new google.maps.Map(document.getElementById("map"), {
          center,
          zoom: 12,
          // mapId: "YOUR_CLOUD_MAP_ID" // Optional: if you've set up Cloud-based map styling
        });

        // Add a simple marker at the center
        new google.maps.Marker({ position: center, map, title: "Nagpur" });
      }
    </script>

    <!-- Replace YOUR_API_KEY_HERE with your actual Google Maps JavaScript API key -->
    <script
      src="https://maps.googleapis.com/maps/api/js?key=&callback=initMap"
      defer
    ></script>
  </body>
</html>
